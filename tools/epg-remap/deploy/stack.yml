# Swarm stack for epg-remap on the KVM 8, reachable only over Tailscale.
#
# The guide server has no public route: it sits on a private overlay network, and a Tailscale
# sidecar joins the tailnet as "epg" (tag:epg) and serves it over HTTPS at
# https://epg.<tailnet>.ts.net. Userspace networking: no /dev/net/tun or host changes.
# Deployed by deploy/hostinger-deployer.yml; values come from the deployer's environment.
services:
  epg-remap:
    image: epg-remap:${EPG_IMAGE_TAG:-latest}
    init: true
    environment:
      M3U_URL: ${M3U_URL:?M3U_URL must be set}
      EPG_ACCESS_TOKEN: ${EPG_ACCESS_TOKEN:-}
      EPG_REPORT_AUTH: ${EPG_REPORT_AUTH:-}
      EPG_REFRESH_HOURS: ${EPG_REFRESH_HOURS:-2}
      EPG_GROUP_FILTER: ${EPG_GROUP_FILTER:-}
      # Reviewed matches and blocks, fetched fresh on every refresh: edit, push, done.
      EPG_OVERRIDES: ${EPG_OVERRIDES:-https://raw.githubusercontent.com/shooter51/M3uEditor/epg-remap/tools/epg-remap/deploy/overrides.json}
      PORT: "8080"
      # Keep the heap well inside the 512M limit; the locals feed makes generation heavier.
      NODE_OPTIONS: --max-old-space-size=384
    volumes:
      - epgdata:/data
    networks:
      - private
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      resources:
        limits:
          memory: 512M

  tailscale:
    image: tailscale/tailscale:stable
    hostname: epg
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?TS_AUTHKEY must be set (tagged tag:epg)}
      TS_HOSTNAME: ${TS_HOSTNAME:-epg}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_SERVE_CONFIG: /config/serve.json
      # HTTPS on the tailnet name, proxied to the guide server. containerboot fills in
      # TS_CERT_DOMAIN (epg.<tailnet>.ts.net) itself.
      SERVE_JSON: '{"TCP":{"443":{"HTTPS":true}},"Web":{"$${TS_CERT_DOMAIN}:443":{"Handlers":{"/":{"Proxy":"http://epg-remap:8080"}}}}}'
    entrypoint: ["/bin/sh", "-c", "mkdir -p /config && printf '%s' \"$$SERVE_JSON\" > /config/serve.json && exec /usr/local/bin/containerboot"]
    volumes:
      - tsstate:/var/lib/tailscale
    networks:
      - private
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      resources:
        limits:
          memory: 128M

volumes:
  epgdata:
  tsstate:

networks:
  private:
    driver: overlay
