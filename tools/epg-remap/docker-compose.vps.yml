# epg-remap on the KVM 8 via Hostinger's Docker Manager, routed by the existing
# (Dokploy) Traefik on 80/443. The image is built on the VPS straight from GitHub.
# Project env: M3U_URL (required), EPG_ACCESS_TOKEN, EPG_REPORT_AUTH (optional).
services:
  epg-remap:
    build:
      context: https://github.com/shooter51/M3uEditor.git#epg-remap:tools/epg-remap
    image: epg-remap:latest
    restart: unless-stopped
    init: true
    environment:
      M3U_URL: ${M3U_URL:?M3U_URL must be set}
      EPG_ACCESS_TOKEN: ${EPG_ACCESS_TOKEN:-}
      EPG_REPORT_AUTH: ${EPG_REPORT_AUTH:-}
      EPG_REFRESH_HOURS: ${EPG_REFRESH_HOURS:-6}
      EPG_GROUP_FILTER: ${EPG_GROUP_FILTER:-}
      PORT: 8080
    volumes:
      - epgdata:/data
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 64
    networks:
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.epg-remap.rule=Host(`epg.tomshappyplace.com`)
      - traefik.http.routers.epg-remap.entrypoints=websecure
      - traefik.http.routers.epg-remap.tls.certresolver=letsencrypt
      - traefik.http.services.epg-remap.loadbalancer.server.port=8080

volumes:
  epgdata:

networks:
  dokploy-network:
    external: true
